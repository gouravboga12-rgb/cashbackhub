<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/perkfy-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5B21B6" />
    <meta
      name="description"
      content="Perkfy — Earn daily rewards, watch ads, spin the wheel and redeem digital gift vouchers!"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>Perkfy — Earn Points, Get Rewards!</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script>
      (function() {
        try {
          var hash = window.location.hash || '';
          if (hash.indexOf('access_token=') !== -1 && hash.indexOf('state=app_mobile_oauth') !== -1) {
            var params = new URLSearchParams(hash.replace(/^#/, ''));
            var token = params.get('access_token');
            if (token) {
              window.location.href = 'perkfy://oauth#access_token=' + token;
              setTimeout(function() {
                window.location.href = 'com.perkfy.app://oauth#access_token=' + token;
              }, 300);
            }
          }
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
